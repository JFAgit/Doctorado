<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2400" viewBox="0 0 1400 2400">
  <defs>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #2b2100; }
      .sub { font: 400 24px Arial, sans-serif; fill: #5b4700; }
      .h2 { font: 700 30px Arial, sans-serif; fill: #2b2100; }
      .cardTitle { font: 700 28px Arial, sans-serif; fill: #2b2100; }
      .txt { font: 400 23px Arial, sans-serif; fill: #3c3100; }
      .small { font: 400 20px Arial, sans-serif; fill: #5b4700; }
      .tiny { font: 400 17px Arial, sans-serif; fill: #6c5700; }
      .emoji { font: 400 34px Arial, sans-serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#9b7a00" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1400" height="2400" fill="#fff8d7"/>
  <circle cx="1190" cy="115" r="82" fill="#ffd84d" opacity="0.6"/>
  <circle cx="1275" cy="210" r="40" fill="#ffbf1f" opacity="0.35"/>
  <circle cx="120" cy="2260" r="90" fill="#ffe680" opacity="0.45"/>

  <text x="70" y="80" class="title">Resumen de hoy</text>
  <text x="70" y="123" class="sub">Datasets humanos de macrofagos por sexo</text>
  <text x="70" y="158" class="small">GSE30595 como referencia externa</text>

  <rect x="70" y="205" width="1260" height="170" rx="18" fill="#ffe066" filter="url(#shadow)"/>
  <text x="105" y="255" class="h2">Lectura general</text>
  <text x="105" y="300" class="txt">Encontramos bases humanas utiles.</text>
  <text x="105" y="338" class="txt">La mejor nueva por n fue GSE151928.</text>
  <text x="760" y="300" class="txt">15 sujetos sanos</text>
  <text x="760" y="338" class="txt">9M / 6F con sexo explicito</text>

  <!-- E-MTAB-7572 -->
  <rect x="70" y="430" width="1260" height="180" rx="18" fill="#fff3a6" stroke="#f2c230" stroke-width="3" filter="url(#shadow)"/>
  <text x="105" y="482" class="emoji">🟡</text>
  <text x="160" y="480" class="cardTitle">E-MTAB-7572</text>
  <text x="160" y="525" class="txt">MDM in vitro · RNA-seq</text>
  <text x="160" y="563" class="small">n = 3 donantes · 24 muestras · sexo 2M / 1F</text>
  <text x="160" y="598" class="small">Metadata explicita y validada por genes X/Y.</text>

  <!-- GSE35449 -->
  <rect x="70" y="650" width="1260" height="180" rx="18" fill="#fff3a6" stroke="#f2c230" stroke-width="3" filter="url(#shadow)"/>
  <text x="105" y="702" class="emoji">🟡</text>
  <text x="160" y="700" class="cardTitle">GSE35449</text>
  <text x="160" y="745" class="txt">MDM M0 / M1 / M2 · array</text>
  <text x="160" y="783" class="small">n = 7 donantes · 21 muestras · sexo inferido 6M / 1F</text>
  <text x="160" y="818" class="small">Muy bueno biologicamente, pero desbalanceado.</text>

  <!-- GSE18686 -->
  <rect x="70" y="870" width="1260" height="180" rx="18" fill="#fff3a6" stroke="#f2c230" stroke-width="3" filter="url(#shadow)"/>
  <text x="105" y="922" class="emoji">🟡</text>
  <text x="160" y="920" class="cardTitle">GSE18686</text>
  <text x="160" y="965" class="txt">Macrofagos de buffy coats normales · array</text>
  <text x="160" y="1003" class="small">n = 6 donantes · 48 muestras macrofagicas · sexo 2M / 4F</text>
  <text x="160" y="1038" class="small">Complementario; el control queda flojo en varones.</text>

  <!-- GSE151928 -->
  <rect x="70" y="1090" width="1260" height="290" rx="18" fill="#fff0bd" stroke="#e7b416" stroke-width="4" filter="url(#shadow)"/>
  <text x="105" y="1142" class="emoji">🌟</text>
  <text x="160" y="1140" class="cardTitle">GSE151928</text>
  <text x="160" y="1185" class="txt">BAL sano · single-cell RNA-seq</text>
  <text x="160" y="1223" class="small">n = 15 sujetos · sexo explicito 9M / 6F</text>
  <text x="160" y="1265" class="small">Hicimos pseudobulk BAL total.</text>
  <text x="160" y="1300" class="small">Despues hicimos marker-myeloid/macrophage-like.</text>
  <text x="160" y="1335" class="small">Resultado anti/M2: 2-3 genes nominales, 0 FDR.</text>
  <text x="160" y="1370" class="small">BAL era 95.6% a 100% myeloid-like por marcadores.</text>

  <!-- GSE228087 -->
  <rect x="70" y="1420" width="1260" height="205" rx="18" fill="#fff3a6" stroke="#f2c230" stroke-width="3" filter="url(#shadow)"/>
  <text x="105" y="1472" class="emoji">🟡</text>
  <text x="160" y="1470" class="cardTitle">GSE228087</text>
  <text x="160" y="1515" class="txt">MDM M-CSF / IL4+IL13 / LPS+IFNg · RNA-seq</text>
  <text x="160" y="1553" class="small">n = 5 donantes · 16 muestras · sexo tentativo 1M / 4F</text>
  <text x="160" y="1588" class="small">Muy cercano al objetivo M0/M1/M2, pero poco balanceado.</text>

  <!-- others -->
  <rect x="70" y="1665" width="1260" height="230" rx="18" fill="#fff3a6" stroke="#f2c230" stroke-width="3" filter="url(#shadow)"/>
  <text x="105" y="1717" class="emoji">🟡</text>
  <text x="160" y="1715" class="cardTitle">Placenta y otros candidatos</text>
  <text x="160" y="1760" class="txt">GSE174689: Hofbauer cells · 12 muestras</text>
  <text x="160" y="1798" class="small">Sexo no resuelto: la senal X/Y no separa limpio.</text>
  <text x="160" y="1838" class="txt">GSE61298 / GSE199378 / GSE71253</text>
  <text x="160" y="1876" class="small">n = 2-3 donantes; sexo pendiente o inferible.</text>

  <!-- key result -->
  <rect x="70" y="1945" width="1260" height="185" rx="18" fill="#ffe680" stroke="#f2c230" stroke-width="3" filter="url(#shadow)"/>
  <text x="105" y="1998" class="h2">Resultado clave</text>
  <text x="105" y="2044" class="txt">GSE151928 tiene buen n y sexo explicito.</text>
  <text x="105" y="2082" class="txt">Pero en BAL sano no aparece un sesgo antiinflamatorio fuerte.</text>
  <text x="105" y="2120" class="small">Anti/M2: 2.56% a 3.61% nominales, sin FDR.</text>

  <!-- takeaway -->
  <rect x="70" y="2180" width="1260" height="135" rx="18" fill="#ffcf33" filter="url(#shadow)"/>
  <text x="105" y="2232" class="h2">Take-home</text>
  <text x="105" y="2278" class="txt">La senal de GSE30595 podria ser especifica de M1/estimulacion in vitro.</text>
  <text x="105" y="2315" class="txt">En macrofagos sanos de BAL, la homeostasis parece apagar ese contraste.</text>

  <text x="70" y="2368" class="tiny">06_datasets_externos · resumen informal con aire suficiente para que no se pise nada</text>
</svg>
